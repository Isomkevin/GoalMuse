<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoalMuse Login Screen Variant 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13b6ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101d22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "serif": ["Playfair Display", "serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col overflow-x-hidden max-w-[430px] mx-auto bg-white dark:bg-background-dark shadow-2xl">
<!-- Top App Bar / Brand Header -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-center pt-12">
<h2 class="text-[#111618] dark:text-white text-3xl font-serif leading-tight tracking-tight">GoalMuse</h2>
</div>
<!-- Headline / Welcome Text -->
<div class="px-6 pt-12 pb-6">
<h1 class="text-[#111618] dark:text-white tracking-tight text-[28px] font-bold leading-tight">Focus on what matters.</h1>
<p class="text-[#617f89] dark:text-[#a1b3ba] text-base mt-2">Log in to track your progress and stay motivated.</p>
</div>
<!-- Input Section -->
<div class="flex flex-col gap-1 px-4 mt-4">
<!-- Email Field -->
<div class="flex flex-col w-full py-2">
<label class="flex flex-col w-full">
<p class="text-[#111618] dark:text-white text-sm font-medium leading-normal pb-2 px-1">Email address</p>
<input class="form-input flex w-full rounded-xl text-[#111618] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe3e6] dark:border-slate-700 bg-white dark:bg-slate-800 h-14 placeholder:text-[#617f89] p-[15px] text-base font-normal" placeholder="your@email.com" type="email"/>
</label>
</div>
<!-- Password Field -->
<div class="flex flex-col w-full py-2">
<label class="flex flex-col w-full">
<div class="flex justify-between items-center pb-2 px-1">
<p class="text-[#111618] dark:text-white text-sm font-medium leading-normal">Password</p>
</div>
<div class="flex w-full items-stretch rounded-xl border border-[#dbe3e6] dark:border-slate-700 bg-white dark:bg-slate-800 focus-within:ring-2 focus-within:ring-primary/50">
<input class="form-input flex w-full min-w-0 flex-1 border-none bg-transparent h-14 text-[#111618] dark:text-white placeholder:text-[#617f89] p-[15px] text-base font-normal focus:ring-0" placeholder="Enter your password" type="password"/>
<button class="text-[#617f89] flex items-center justify-center pr-[15px] focus:outline-none">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</label>
<div class="flex justify-end mt-2">
<a class="text-primary text-sm font-medium hover:underline" href="#">Forgot password?</a>
</div>
</div>
</div>
<!-- Main Action Section (Positioned for Easy Thumb Reach) -->
<div class="mt-auto px-6 pb-12 flex flex-col items-center gap-6">
<!-- Login Button -->
<button class="w-full h-14 bg-primary hover:bg-primary/90 text-white font-bold text-lg rounded-xl shadow-lg transition-all active:scale-[0.98]">
                Log in
            </button>
<!-- Secondary Link -->
<div class="flex flex-col items-center gap-2">
<p class="text-[#617f89] dark:text-[#a1b3ba] text-sm">New to GoalMuse?</p>
<a class="text-primary font-bold text-base hover:underline" href="#">Create account</a>
</div>
</div>
<!-- Visual Decorative Element (Subtle Background Detail) -->
<div class="absolute -bottom-20 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="absolute top-20 -right-20 w-48 h-48 bg-primary/10 rounded-full blur-2xl -z-10"></div>
</div>
</body></html>
