<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoalMuse Goals Empty State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a7da4",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101d22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center">
<div class="relative flex h-screen max-w-[430px] w-full flex-col bg-white dark:bg-background-dark overflow-hidden shadow-2xl border-x border-gray-100 dark:border-gray-800">
<!-- TopAppBar -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between shrink-0">
<div class="text-[#111618] dark:text-white flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined cursor-pointer">menu</span>
</div>
<h2 class="text-[#111618] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Goals</h2>
<div class="size-12 flex items-center justify-end">
<span class="material-symbols-outlined text-[#111618] dark:text-white cursor-pointer">settings</span>
</div>
</div>
<!-- Content Area / EmptyState -->
<div class="flex flex-col flex-1 px-6 py-12 items-center justify-center">
<div class="flex flex-col items-center gap-8 w-full">
<!-- Decorative Minimalist Placeholder -->
<div class="relative w-full max-w-[280px] aspect-square rounded-full bg-primary/5 flex items-center justify-center">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-transparent rounded-full"></div>
<div class="z-10 bg-white dark:bg-gray-800 p-8 rounded-full shadow-sm border border-primary/10">
<span class="material-symbols-outlined text-primary !text-6xl">target</span>
</div>
</div>
<div class="flex max-w-[480px] flex-col items-center gap-3">
<p class="text-[#111618] dark:text-white text-2xl font-bold leading-tight tracking-[-0.015em] text-center">No goals yet</p>
<p class="text-[#60808a] dark:text-gray-400 text-base font-normal leading-relaxed text-center px-4">
                        Every journey begins with a single step. Add your first goal to get started.
                    </p>
</div>
<div class="hidden">
<button class="flex min-w-[140px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-12 px-6 bg-primary/10 text-primary text-sm font-bold leading-normal tracking-[0.015em]">
<span class="truncate">Create Vision</span>
</button>
</div>
</div>
</div>
<!-- Add Goal CTA -->
<div class="flex px-6 py-4 bg-white dark:bg-background-dark shrink-0">
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 px-5 bg-primary text-white text-lg font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20">
<span class="truncate">Add goal</span>
</button>
</div>
<!-- BottomNavBar -->
<div class="flex gap-2 border-t border-gray-100 dark:border-gray-800 bg-white dark:bg-background-dark px-4 pb-8 pt-3 shrink-0">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-[#60808a] dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">spark</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Vision</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined material-symbols-fill">target</span>
</div>
<p class="text-xs font-bold leading-normal tracking-[0.015em]">Goals</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-[#60808a] dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">bar_chart</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Stats</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-[#60808a] dark:text-gray-500" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">person</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Profile</p>
</a>
</div>
</div>
</body></html>
