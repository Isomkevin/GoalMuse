<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoalMuse Premium Sign-up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a7da4",
                        "background-light": "#fdfdfb",
                        "background-dark": "#101d22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center">
<div class="relative flex h-full min-h-screen w-full max-w-[430px] flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden shadow-2xl">
<div class="flex items-center bg-transparent p-4 pb-2 justify-between">
<div class="text-primary flex size-12 shrink-0 items-center cursor-pointer" data-icon="ArrowBack">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</div>
<h2 class="text-primary text-sm font-semibold leading-tight tracking-wide flex-1 text-center pr-12 uppercase">GoalMuse</h2>
</div>
<div class="px-4">
<h1 class="text-[#111618] dark:text-white tracking-light text-[32px] font-bold leading-tight pt-10">Create account</h1>
<p class="text-[#60808a] dark:text-gray-400 text-lg font-light leading-normal pt-2">Start your vision board.</p>
</div>
<div class="mt-8 flex flex-col gap-2">
<div class="flex flex-wrap items-end gap-4 px-4 py-2">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal pb-2 ml-1">Email</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111618] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#dbe3e6] dark:border-gray-700 bg-white dark:bg-background-dark focus:border-primary h-14 placeholder:text-[#60808a]/60 p-[15px] text-base font-normal leading-normal" placeholder="Enter your email" type="email" value=""/>
</label>
</div>
<div class="flex flex-wrap items-end gap-4 px-4 py-2">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal pb-2 ml-1">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-xl">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111618] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#dbe3e6] dark:border-gray-700 bg-white dark:bg-background-dark focus:border-primary h-14 placeholder:text-[#60808a]/60 p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<div class="text-[#60808a] flex border border-[#dbe3e6] dark:border-gray-700 bg-white dark:bg-background-dark items-center justify-center pr-[15px] rounded-r-xl border-l-0" data-icon="Visibility">
<span class="material-symbols-outlined text-[22px]">visibility</span>
</div>
</div>
</label>
</div>
</div>
<div class="px-4 pt-2 min-h-[40px]">
<p class="text-red-500 text-sm font-medium hidden">Please enter a valid email address.</p>
</div>
<div class="px-4 py-6 mt-2">
<button class="w-full h-14 bg-primary hover:bg-[#086a8a] text-white font-semibold rounded-xl transition-colors duration-200 shadow-md">
                Create account
            </button>
</div>
<div class="mt-auto pb-10 flex flex-col items-center gap-4">
<p class="text-[#60808a] text-sm">
                Already have an account? 
                <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4 ml-1" href="#">Log in</a>
</p>
<div class="w-32 h-1 bg-[#dbe3e6] dark:bg-gray-700 rounded-full mt-4"></div>
</div>
<div class="absolute top-0 right-0 p-8 opacity-5 -z-10">
<span class="material-symbols-outlined text-[200px] text-primary">auto_awesome</span>
</div>
</div>
</body></html>
