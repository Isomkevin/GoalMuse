<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoalMuse - My Boards</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a7da4",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101d22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111618] dark:text-white transition-colors duration-300">
<div class="relative flex h-screen w-full flex-col overflow-hidden max-w-[430px] mx-auto border-x border-gray-100 dark:border-gray-800 shadow-2xl">
<!-- TopAppBar -->
<header class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-[#111618] dark:text-white flex size-12 shrink-0 items-center justify-start">
<button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
<h2 class="text-[#111618] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">My boards</h2>
<div class="flex w-12 items-center justify-end">
<button class="flex size-12 cursor-pointer items-center justify-center overflow-hidden rounded-xl bg-transparent text-[#111618] dark:text-white hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined">add_circle</span>
</button>
</div>
</header>
<!-- Main Content Area: EmptyState -->
<main class="flex-1 flex flex-col items-center justify-center px-8 py-6">
<div class="flex flex-col items-center w-full max-w-sm gap-8">
<!-- Calm Illustration Placeholder -->
<div class="relative w-full aspect-square max-w-[280px] flex items-center justify-center">
<div class="absolute inset-0 bg-primary/5 dark:bg-primary/10 rounded-full animate-pulse"></div>
<div class="relative flex flex-col items-center justify-center gap-4">
<div class="w-32 h-32 rounded-xl bg-white dark:bg-gray-800 shadow-xl flex items-center justify-center transform -rotate-6 border border-gray-50 dark:border-gray-700">
<span class="material-symbols-outlined text-primary/40 !text-5xl">image</span>
</div>
<div class="absolute -right-4 -bottom-2 w-24 h-24 rounded-xl bg-white dark:bg-gray-800 shadow-lg flex items-center justify-center transform rotate-12 border border-gray-50 dark:border-gray-700">
<span class="material-symbols-outlined text-primary/30 !text-4xl">edit_note</span>
</div>
</div>
</div>
<div class="flex flex-col items-center gap-3 text-center">
<h3 class="text-[#111618] dark:text-white text-2xl font-bold leading-tight tracking-[-0.02em]">No boards yet</h3>
<p class="text-[#60808a] dark:text-gray-400 text-base font-normal leading-relaxed max-w-[240px]">
                        Create your first vision board to start visualizing your future.
                    </p>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="bg-white/80 dark:bg-background-dark/80 backdrop-blur-md px-6 py-4 pb-8">
<button class="w-full h-14 bg-primary hover:bg-primary/90 text-white rounded-xl text-lg font-bold shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add</span>
<span>Create board</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="flex gap-2 border-t border-[#f0f3f5] dark:border-gray-800 bg-white dark:bg-background-dark px-4 pb-8 pt-2">
<a class="flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-primary" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined font-fill">grid_view</span>
</div>
<p class="text-xs font-semibold leading-normal tracking-[0.015em]">Boards</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-[#60808a] dark:text-gray-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">track_changes</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Goals</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-[#60808a] dark:text-gray-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">bar_chart</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Stats</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-[#60808a] dark:text-gray-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">person</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Profile</p>
</a>
</nav>
</div>
</body></html>
