<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoalMuse - Add New Goal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13b6ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101d22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111618] dark:text-white antialiased">
<div class="mx-auto min-h-screen max-w-[430px] bg-white dark:bg-[#111618] flex flex-col shadow-2xl relative overflow-hidden">
<!-- Header -->
<header class="sticky top-0 z-10 flex items-center justify-between bg-white/80 dark:bg-[#111618]/80 ios-blur px-4 py-4 border-b border-[#dbe3e6]/30 dark:border-white/10">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<h1 class="text-lg font-bold leading-tight tracking-tight">New goal</h1>
<div class="size-10"></div> <!-- Spacer for symmetry -->
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-6 py-8">
<div class="flex flex-col gap-8">
<!-- Visual Header / Inspiration -->
<div class="relative h-48 w-full overflow-hidden rounded-xl bg-gradient-to-br from-[#13b6ec]/20 to-[#13b6ec]/5 border border-[#13b6ec]/10">
<div class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center">
<span class="material-symbols-outlined text-primary text-4xl mb-2 opacity-80">auto_awesome</span>
<p class="text-sm font-medium text-[#111618]/60 dark:text-white/60">Visualize your success</p>
<p class="text-xs text-[#111618]/40 dark:text-white/40 mt-1">Add an image to your vision board later</p>
</div>
</div>
<!-- Form Fields -->
<div class="space-y-6">
<!-- Goal Name -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold tracking-wide uppercase text-[#111618]/60 dark:text-white/60 px-1">Goal Name</label>
<input class="w-full rounded-xl border-[#dbe3e6] dark:border-white/10 bg-white dark:bg-white/5 h-14 px-4 text-base focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-[#617f89]/50" placeholder="e.g. Speak at a global event" type="text"/>
</div>
<!-- Description -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold tracking-wide uppercase text-[#111618]/60 dark:text-white/60 px-1">Description</label>
<textarea class="w-full rounded-xl border-[#dbe3e6] dark:border-white/10 bg-white dark:bg-white/5 min-h-[140px] p-4 text-base focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-[#617f89]/50 resize-none" placeholder="Describe your vision and steps to reach it..."></textarea>
</div>
<!-- Target Date -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold tracking-wide uppercase text-[#111618]/60 dark:text-white/60 px-1">Target Date</label>
<div class="relative">
<select class="appearance-none w-full rounded-xl border-[#dbe3e6] dark:border-white/10 bg-white dark:bg-white/5 h-14 px-4 pr-12 text-base focus:border-primary focus:ring-1 focus:ring-primary transition-all">
<option value="">Select a date</option>
<option value="3-months">3 Months (Next Quarter)</option>
<option value="6-months">6 Months</option>
<option value="1-year">1 Year</option>
<option value="custom">Pick custom date...</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-[#617f89]">
                                calendar_today
                            </span>
</div>
</div>
<!-- Category Chip Selection (Extra UI touch) -->
<div class="flex flex-col gap-3">
<label class="text-sm font-semibold tracking-wide uppercase text-[#111618]/60 dark:text-white/60 px-1">Category</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-primary bg-primary/10 text-primary text-sm font-medium">Career</button>
<button class="px-4 py-2 rounded-full border border-[#dbe3e6] dark:border-white/10 text-[#111618]/70 dark:text-white/70 text-sm font-medium">Health</button>
<button class="px-4 py-2 rounded-full border border-[#dbe3e6] dark:border-white/10 text-[#111618]/70 dark:text-white/70 text-sm font-medium">Personal</button>
<button class="px-4 py-2 rounded-full border border-[#dbe3e6] dark:border-white/10 text-[#111618]/70 dark:text-white/70 text-sm font-medium">Finance</button>
</div>
</div>
</div>
</div>
</main>
<!-- Footer Action -->
<footer class="p-6 bg-white dark:bg-[#111618] border-t border-[#dbe3e6]/30 dark:border-white/10">
<button class="w-full bg-primary hover:bg-[#11a5d6] text-white h-14 rounded-xl font-bold text-lg shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Save goal</span>
<span class="material-symbols-outlined">check_circle</span>
</button>
<p class="text-center text-xs text-[#111618]/40 dark:text-white/40 mt-4">
                You can edit this goal at any time
            </p>
</footer>
<!-- iOS Home Indicator -->
<div class="h-8 flex justify-center items-center">
<div class="w-32 h-1.5 bg-black/10 dark:bg-white/10 rounded-full"></div>
</div>
</div>
</body></html>
