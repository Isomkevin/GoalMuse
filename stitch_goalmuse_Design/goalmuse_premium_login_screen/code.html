<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoalMuse Premium Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a7da3",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101e22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center p-6">
<div class="w-full max-w-[400px] flex flex-col items-center">
<div class="mb-12 text-center">
<h1 class="text-[#111618] dark:text-white text-[42px] font-bold leading-tight tracking-tight font-display mb-2">GoalMuse</h1>
<p class="text-[#60808a] dark:text-[#a0b0b5] text-lg font-light leading-normal">Your vision, one board.</p>
</div>
<div class="w-full space-y-6">
<div class="flex flex-col gap-2">
<label class="text-[#111618] dark:text-white text-sm font-semibold ml-1">Email</label>
<input class="w-full h-14 px-5 rounded-xl border border-[#dbe3e6] dark:border-[#2a3a40] bg-white dark:bg-[#1a2b30] text-[#111618] dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none placeholder:text-[#60808a]/60" placeholder="Enter your email" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-[#111618] dark:text-white text-sm font-semibold ml-1">Password</label>
<div class="relative w-full">
<input class="w-full h-14 px-5 pr-12 rounded-xl border border-[#dbe3e6] dark:border-[#2a3a40] bg-white dark:bg-[#1a2b30] text-[#111618] dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none placeholder:text-[#60808a]/60" placeholder="Enter your password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-[#60808a] dark:text-[#a0b0b5] flex items-center justify-center">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<button class="w-full h-14 bg-primary hover:bg-primary/90 text-white font-bold rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center text-lg mt-4">
                Log in
            </button>
<div class="flex justify-center pt-2">
<button class="text-primary dark:text-[#38b2d1] font-medium text-sm hover:underline transition-all">
                    Create account
                </button>
</div>
</div>
<div class="mt-auto pt-24 pb-4">
<p class="text-[#60808a] dark:text-[#60808a]/60 text-xs font-medium tracking-wide uppercase">
                Demo: <span class="font-normal lowercase">demo@goalmuse.app</span>
</p>
</div>
</div>
<div class="fixed top-0 left-0 w-full h-full -z-10 opacity-30 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-primary/5 blur-[120px] rounded-full"></div>
</div>
</body></html>
