<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoalMuse Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a7da4",
                        "background-light": "#f5f8f8",
                        "background-dark": "#101d22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-6">
<div class="relative flex h-full w-full max-w-[480px] flex-col bg-white dark:bg-background-dark rounded-[40px] shadow-2xl overflow-hidden border border-gray-100 dark:border-gray-800">
<!-- Subtle Top Aesthetic -->
<div class="h-32 w-full bg-gradient-to-b from-primary/10 to-transparent"></div>
<div class="flex flex-col px-8 pb-12 -mt-12">
<!-- App Branding -->
<div class="flex flex-col items-center mb-12">
<div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-4xl">auto_awesome</span>
</div>
<h1 class="text-[#111618] dark:text-white tracking-tight text-[36px] font-bold leading-tight text-center">GoalMuse</h1>
<p class="text-[#60808a] dark:text-gray-400 text-base font-normal leading-normal text-center mt-2">Your vision, one board.</p>
</div>
<!-- Login Form -->
<div class="space-y-4">
<div class="flex flex-col w-full">
<p class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal pb-2 px-1">Email</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl">mail</span>
<input class="form-input flex w-full rounded-xl text-[#111618] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#dbe3e6] dark:border-gray-700 bg-white dark:bg-gray-800 h-14 placeholder:text-[#60808a] pl-12 pr-4 text-base font-normal leading-normal transition-all" placeholder="Enter your email" type="email" value=""/>
</div>
</div>
<div class="flex flex-col w-full">
<p class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal pb-2 px-1">Password</p>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl">lock</span>
<input class="form-input flex w-full rounded-xl text-[#111618] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/20 border border-[#dbe3e6] dark:border-gray-700 bg-white dark:bg-gray-800 h-14 placeholder:text-[#60808a] pl-12 pr-4 text-base font-normal leading-normal transition-all" placeholder="Enter your password" type="password" value=""/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
</div>
<div class="flex justify-end mt-2">
<a class="text-primary text-sm font-medium hover:underline" href="#">Forgot password?</a>
</div>
<!-- Action Buttons -->
<div class="mt-8 space-y-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-4 rounded-xl shadow-lg shadow-primary/25 transition-all active:scale-[0.98]">
                    Log in
                </button>
<div class="flex items-center justify-center gap-2 pt-2">
<span class="text-[#60808a] text-sm">New to GoalMuse?</span>
<a class="text-primary font-semibold text-sm hover:underline" href="#">Create account</a>
</div>
</div>
<!-- Footer / Demo Hint -->
<div class="mt-16 flex flex-col items-center">
<div class="flex items-center gap-1.5 px-4 py-2 bg-gray-50 dark:bg-gray-800/50 rounded-full">
<span class="material-symbols-outlined text-[14px] text-gray-400">info</span>
<p class="text-[#60808a] dark:text-gray-500 text-xs font-medium">Demo: demo@goalmuse.app</p>
</div>
</div>
</div>
<!-- Decorative Bottom Element -->
<div class="mt-auto h-2 w-full bg-primary"></div>
</div>
</body></html>
