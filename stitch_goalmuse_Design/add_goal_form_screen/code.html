<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Goal - GoalMuse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a7da4",
                        "background-light": "#fdfcfb",
                        "background-dark": "#101d22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-[480px] mx-auto group/design-root overflow-x-hidden shadow-sm bg-background-light dark:bg-background-dark">
<!-- TopAppBar -->
<header class="sticky top-0 z-10 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100 dark:border-gray-800">
<div class="text-[#111618] dark:text-white flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-[#111618] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">New goal</h2>
</header>
<main class="flex-1 px-4 py-6">
<!-- Goal Name Field -->
<div class="flex flex-col gap-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111618] dark:text-gray-200 text-sm font-semibold leading-normal pb-2 px-1">Goal</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111618] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe3e6] dark:border-gray-700 bg-white dark:bg-gray-800 h-14 placeholder:text-[#60808a] dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal transition-all" placeholder="e.g. Speak at a global event" type="text" value=""/>
</label>
</div>
<!-- Description Field -->
<div class="flex flex-col gap-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111618] dark:text-gray-200 text-sm font-semibold leading-normal pb-2 px-1">Description (optional)</p>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111618] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbe3e6] dark:border-gray-700 bg-white dark:bg-gray-800 min-h-[160px] placeholder:text-[#60808a] dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal transition-all" placeholder="What does success look like?"></textarea>
</label>
</div>
<!-- Target Date Field -->
<div class="flex flex-col gap-4 py-3">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111618] dark:text-gray-200 text-sm font-semibold leading-normal pb-2 px-1">Target date (optional)</p>
<div class="group flex w-full flex-1 items-stretch rounded-xl overflow-hidden border border-[#dbe3e6] dark:border-gray-700 focus-within:ring-2 focus-within:ring-primary/50 transition-all">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden border-none bg-white dark:bg-gray-800 h-14 text-[#111618] dark:text-white placeholder:text-[#60808a] dark:placeholder:text-gray-500 p-[15px] pr-2 text-base font-normal leading-normal focus:ring-0" placeholder="YYYY-MM-DD" type="text" value=""/>
<div class="text-[#60808a] flex bg-white dark:bg-gray-800 items-center justify-center pr-[15px] cursor-pointer" data-icon="CalendarBlank">
<span class="material-symbols-outlined">calendar_today</span>
</div>
</div>
</label>
</div>
<!-- Visualization Tip (Optional enhancement for GoalMuse aesthetic) -->
<div class="mt-4 p-4 rounded-xl bg-primary/5 dark:bg-primary/10 border border-primary/10">
<div class="flex gap-3">
<span class="material-symbols-outlined text-primary">lightbulb</span>
<p class="text-sm text-primary/80 dark:text-primary/90 leading-relaxed">
                        Tip: Visualize your success while writing. Detail creates clarity.
                    </p>
</div>
</div>
</main>
<!-- Fixed Bottom Button -->
<footer class="sticky bottom-0 mt-auto p-4 bg-background-light dark:bg-background-dark border-t border-gray-100 dark:border-gray-800">
<div class="flex max-w-[480px] mx-auto">
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-opacity-90 active:scale-[0.98] transition-all">
<span class="truncate">Save goal</span>
</button>
</div>
<!-- Safe area spacing for mobile -->
<div class="h-4"></div>
</footer>
</div>
</body></html>
